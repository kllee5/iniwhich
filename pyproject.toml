[project]
name = "iniwhich"
version = "0.1.0"
description = "Trace which INI file sets a key's effective value across layered configs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "kllee5"}]

[project.scripts]
iniwhich = "iniwhich.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
